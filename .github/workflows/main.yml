name: Terraform_workflow

on: workflow_dispatch
permissions:
 contents: read
 id-token: write
 
jobs:
  terraform_init2:
      runs-on: self-hosted
      steps:
        - uses: Qonfused/checkout@4.2.2

        - name: terraform_init
          run: terraform init

        - name: Azure Login
          uses: Azure/login@v3.0.2
          with:
            client-id: "c5fb60c4-d9e7-444c-b210-5b030036fb7b"
            tenant-id: "95318efb-83b7-46ef-883c-ba496fd97053"
            subscription-id: "419df3c6-e8dd-4035-b096-c692fe3e62a8"

        - name: terraform_plan
          run: terraform plan
          working-directory: ./todo-ui
  terraform_apply:
    runs-on: self-hosted
    environment: prod
    steps:
       - uses: Qonfused/checkout@4.2.2

       - name: terraform_init
         run: terraform init

       - name: Azure Login
         uses: Azure/login@v3.0.2
         with:
           client-id: "c5fb60c4-d9e7-444c-b210-5b030036fb7b"
           tenant-id: "95318efb-83b7-46ef-883c-ba496fd97053"
           subscription-id: "419df3c6-e8dd-4035-b096-c692fe3e62a8"

       - name: terraform_apply
         run: terraform apply
         working-directory: ./todo-ui
   
     
